plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Bundle LWJGL (core + OpenCL) as nested jars so the dedicated server has them at runtime.
jarJar.enable()

configurations {
    lwjglNatives
}

dependencies {
    // Specify the version of Minecraft to use.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // LWJGL OpenCL bindings (classes only). LWJGL's OpenCL binding is JNI-free: it loads the
    // system OpenCL ICD loader (OpenCL.dll / libOpenCL.so) provided by the GPU driver. So no
    // LWJGL OpenCL natives jar exists (and none is needed).
    implementation "org.lwjgl:lwjgl-opencl:3.3.1"
    jarJar(group: 'org.lwjgl', name: 'lwjgl-opencl', version: '[3.3.1,3.3.2)') {
        jarJar.pin(it, '3.3.1')
    }
    jarJar(group: 'org.lwjgl', name: 'lwjgl', version: '[3.3.1,3.3.2)') {
        jarJar.pin(it, '3.3.1')
    }

    // LWJGL core natives, bundled as resources and extracted at runtime as a fallback
    // (see dev.gpuaccel.gpu.LwjglNatives). Minecraft itself only ships a subset of LWJGL.
    lwjglNatives "org.lwjgl:lwjgl:3.3.1:natives-windows"
    lwjglNatives "org.lwjgl:lwjgl:3.3.1:natives-linux"
    lwjglNatives "org.lwjgl:lwjgl:3.3.1:natives-macos"
}

// Copy the LWJGL core native libraries into the jar resources so they can be extracted at runtime.
def extractLwjglNatives = tasks.register('extractLwjglNatives', Copy) {
    from(configurations.lwjglNatives.collect { zipTree(it) })
    into(layout.buildDirectory.dir('generated/natives'))
    include '**/*.dll', '**/*.so', '**/*.dylib'
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/natives'))
tasks.named('processResources').configure { dependsOn extractLwjglNatives }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// Strip the JPMS module-info from the jar-in-jar'd LWJGL jars. The dedicated server needs the
// bundled classes, but the client already ships LWJGL as a module — a bundled module-info would
// cause "Modules org.lwjgl and gpuaccel export package org.lwjgl to module forge".
afterEvaluate {
    tasks.named('reobfJarJar').configure {
        doLast {
            def allJar = input.get().asFile
        def tmp = new File(allJar.parentFile, allJar.name + '.tmp')
        def zin = new java.util.zip.ZipInputStream(new FileInputStream(allJar))
        def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(tmp))
        try {
            def entry
            while ((entry = zin.nextEntry) != null) {
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')) {
                    byte[] nested = zin.readAllBytes()
                    byte[] stripped = stripJarJarNested(new ByteArrayInputStream(nested))
                    def ne = new java.util.zip.ZipEntry(entry.name)
                    zout.putNextEntry(ne)
                    zout.write(stripped)
                    zout.closeEntry()
                } else {
                    def ne = new java.util.zip.ZipEntry(entry)
                    zout.putNextEntry(ne)
                    zin.transferTo(zout)
                    zout.closeEntry()
                }
            }
        } finally {
            zin.close()
            zout.close()
        }
            allJar.delete()
            tmp.renameTo(allJar)
        }
    }
}

// Build a client-only variant: same as the -all.jar but WITHOUT the lwjgl core nested jar.
// The client already ships LWJGL (core) as a JPMS module, so bundling it again causes a split
// package. The client only needs the OpenCL binding (which Minecraft does not ship).
tasks.register('createClientJar') {
    dependsOn 'reobfJarJar'
    def serverJarProvider = tasks.named('reobfJarJar').flatMap { it.input }
    inputs.file(serverJarProvider)
    def clientJar = layout.buildDirectory.file('libs/' + mod_id + '-' + mod_version + '-client.jar')
    outputs.file(clientJar)
    doLast {
        def serverJar = serverJarProvider.get().asFile
        def clientJarFile = clientJar.get().asFile
        def clientMeta = '{"jars":[{"identifier":{"group":"org.lwjgl","artifact":"lwjgl-opencl"},"version":{"range":"[3.3.1,3.3.2)","artifactVersion":"3.3.1"},"path":"META-INF/jarjar/lwjgl-opencl-3.3.1.jar","isObfuscated":false}]}'
        def zin = new java.util.zip.ZipInputStream(new FileInputStream(serverJar))
        def zout = new java.util.zip.ZipOutputStream(new FileOutputStream(clientJarFile))
        try {
            def entry
            while ((entry = zin.nextEntry) != null) {
                if (entry.name == 'META-INF/jarjar/lwjgl-3.3.1.jar') {
                    continue
                }
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zout.write(clientMeta.getBytes('UTF-8'))
                    zout.closeEntry()
                    continue
                }
                zout.putNextEntry(new java.util.zip.ZipEntry(entry))
                zin.transferTo(zout)
                zout.closeEntry()
            }
        } finally {
            zin.close()
            zout.close()
        }
    }
}
tasks.named('build').configure { dependsOn 'createClientJar' }

def stripJarJarNested(InputStream input) {
    def out = new ByteArrayOutputStream()
    def zin = new java.util.zip.ZipInputStream(input)
    def zout = new java.util.zip.ZipOutputStream(out)
    try {
        def e
        while ((e = zin.nextEntry) != null) {
            if (e.name == 'module-info.class' || e.name.startsWith('META-INF/versions/')) {
                continue
            }
            if (e.name == 'META-INF/MANIFEST.MF') {
                def text = new String(zin.readAllBytes(), 'UTF-8')
                def filtered = text.readLines().findAll { !it.startsWith('Multi-Release') }.join('\n')
                def bytes = (filtered + '\n').getBytes('UTF-8')
                zout.putNextEntry(new java.util.zip.ZipEntry('META-INF/MANIFEST.MF'))
                zout.write(bytes)
                zout.closeEntry()
                continue
            }
            zout.putNextEntry(new java.util.zip.ZipEntry(e.name))
            zin.transferTo(zout)
            zout.closeEntry()
        }
    } finally {
        zin.close()
        zout.close()
    }
    return out.toByteArray()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
